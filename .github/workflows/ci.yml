name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium # tests/pathPrefix.test.js drives a real browser
      - name: Syntax-check the front end
        run: for f in web/js/app.js web/js/api.js web/js/views/*.js; do node --check "$f"; done
      - run: npm test

  retry-e2e:
    name: Browser retry test (local server)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start CareOps (fresh database, no KB or model provider)
        run: |
          PORT=3999 DB_PATH=$RUNNER_TEMP/careops.db KB_URL=http://127.0.0.1:9 KB_API_KEY=ci node src/main.js > $RUNNER_TEMP/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3999/health && break; sleep 1; done
      - name: Dropped connection + retry creates exactly one record
        run: BASE_URL=http://127.0.0.1:3999 npx playwright test e2e/retry.spec.js --reporter=line
      - name: Server log
        if: failure()
        run: cat $RUNNER_TEMP/server.log
