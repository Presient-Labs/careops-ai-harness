name: careops
services:
  careops:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    volumes: [careops-data:/data]
    networks: [edge, internal]
    depends_on: [careops-kb]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge-node_internal
      # TRAEFIK_HOST_RULE (required, in .env) lets one deployment answer on several names, e.g. a custom domain plus a fallback
      - traefik.http.routers.careops.rule=${TRAEFIK_HOST_RULE:?set TRAEFIK_HOST_RULE in .env}
      - traefik.http.routers.careops.entrypoints=websecure
      - traefik.http.routers.careops.tls.certresolver=letsencrypt
      - traefik.http.services.careops.loadbalancer.server.port=3000
      # shawndemos.com/careops/: a second router next to the one above. /careops redirects to /careops/, then the prefix is
      # stripped and sent as X-Forwarded-Prefix, which scopes the session cookie to /careops (src/auth/sessions.js).
      - traefik.http.routers.careops-path.rule=Host(`shawndemos.com`) && PathPrefix(`/careops`)
      - traefik.http.routers.careops-path.entrypoints=websecure
      - traefik.http.routers.careops-path.tls.certresolver=letsencrypt
      - traefik.http.routers.careops-path.middlewares=careops-slash,careops-strip
      - traefik.http.routers.careops-path.service=careops
      # Explicit priority: Traefik's default is the rule's length, and the 100-character rule above would win otherwise.
      - traefik.http.routers.careops-path.priority=1000
      - traefik.http.middlewares.careops-slash.redirectregex.regex=^https://shawndemos\.com/careops$$
      - traefik.http.middlewares.careops-slash.redirectregex.replacement=https://shawndemos.com/careops/
      - traefik.http.middlewares.careops-slash.redirectregex.permanent=true
      - traefik.http.middlewares.careops-strip.stripprefix.prefixes=/careops
  careops-kb:
    build:
      context: ${KB_SERVER_SRC:-../knowledge-base-server}
      dockerfile_inline: |
        FROM node:22 AS deps
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci --omit=dev
        FROM node:22-slim
        WORKDIR /app
        COPY --from=deps /app/node_modules ./node_modules
        COPY package.json ./
        COPY bin ./bin
        COPY src ./src
        COPY openapi.json ./
        ENV HOME=/data KB_PORT=3838
        CMD ["node", "bin/kb.js", "start"]
    restart: unless-stopped
    environment:
      KB_PASSWORD: ${KB_PASSWORD}
      KB_API_KEY_CLAUDE: ${KB_API_KEY}
    volumes: [careops-kb-data:/data]
    networks: [internal]          # NOT on the edge network: unreachable from the internet
networks:
  edge: { external: true, name: edge-node_internal }
  internal: { internal: true }
volumes: { careops-data: {}, careops-kb-data: {} }
